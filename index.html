<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>旺邦營造 · 現場出工與鼠患稽查連拍</title>
  <!-- 載入輕量 EXIF 讀寫工具，讓網頁拍出與相簿上傳的照片都保有真實相機 EXIF (DateTimeOriginal) -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
  <style>
    :root, html, body {
      color-scheme: only light !important;
      forced-color-adjust: none !important;
      -webkit-forced-color-adjust: none !important;
    }
    * { box-sizing: border-box; font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      margin: 0; padding: 10px;
      background-color: #F4F2EC;
      color: #2C3A31;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ================= 【第一頁：選擇拍攝類別與廠商頁面】 ================= */
    .card {
      width: 100%; max-width: 440px;
      background-color: #FFFFFF;
      background-size: cover;
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(145, 160, 150, 0.25);
      border: 1.5px solid #E2EBE2;
      position: relative;
    }

    .card-hero {
      background: linear-gradient(135deg, #D2EBD0 0%, #B8DAB7 55%, #C2E5F5 100%);
      background-size: cover;
      border: 1.5px solid #B8D8B7;
    }

    .dots { display: flex; gap: 6px; margin-bottom: 6px; }
    .dot-orange { width: 11px; height: 11px; border-radius: 50%; background: #F6BC7E; }
    .dot-blue { width: 11px; height: 11px; border-radius: 50%; background: #88C4E6; }

    h2 { margin: 2px 0 14px 0; font-size: 21px; text-align: center; color: #243529; font-weight: 800; }
    label.sec-title { font-size: 14px; font-weight: bold; color: #3D5243; display: block; margin-bottom: 6px; }

    .sec-title-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .sync-badge {
      font-size: 11px; font-weight: bold; color: #3A6B48;
      background: rgba(255, 255, 255, 0.78); padding: 2px 8px;
      border-radius: 12px; border: 1px solid #B8D8B7;
    }

    select, input[type="text"] {
      width: 100%; padding: 13px 16px; font-size: 19px; font-weight: bold;
      color: #243529; background-color: #FFFFFF;
      background-size: cover;
      border: 2px solid #CFE3CE; border-radius: 30px;
      box-shadow: 0 4px 12px rgba(120, 145, 125, 0.15);
      outline: none; text-align: center; margin-bottom: 12px;
    }

    .sub-box {
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid #CFE4CE;
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .shift-pill {
      width: 100%; padding: 11px; border-radius: 25px; text-align: center;
      font-weight: bold; font-size: 15px; cursor: pointer;
      background-color: #FFF9EC; background-size: cover; color: #435747;
      border: 2px solid #EBD7B5; margin-top: 4px;
      user-select: none;
    }
    .shift-pill.night {
      background-color: #4A6274; color: #FFFFFF; border-color: #394E5E;
    }

    .btn-orange-huge {
      width: 100%; padding: 17px 14px; border-radius: 30px; border: none;
      background: linear-gradient(135deg, #FAD09C 0%, #F0A35E 100%);
      background-size: cover;
      color: #FFFFFF; font-size: 20px; font-weight: bold;
      text-shadow: 0 1px 3px rgba(150, 75, 15, 0.35);
      box-shadow: 0 7px 16px rgba(240, 163, 94, 0.45);
      cursor: pointer; margin-bottom: 10px; display: block; text-align: center;
      user-select: none;
    }
    .btn-orange-huge:active { transform: scale(0.97); }

    .btn-blue-home {
      width: 100%; padding: 13px 14px; border-radius: 26px;
      border: 1.5px solid #8CC2DE;
      background: linear-gradient(135deg, #D0ECFA 0%, #9BCDE6 100%);
      background-size: cover;
      color: #1A3E52; font-size: 15px; font-weight: bold;
      box-shadow: 0 4px 12px rgba(135, 190, 220, 0.3);
      cursor: pointer; display: block; text-align: center;
      user-select: none;
    }
    .btn-blue-home:active { transform: scale(0.98); }

    .home-status-box {
      margin-top: 10px; padding: 9px 12px; border-radius: 14px;
      background-color: #F0F7F0; background-size: cover;
      border: 1px solid #CDE3CF; color: #2E5E38;
      font-size: 13px; font-weight: bold; text-align: center;
      display: none;
    }

    input[type="file"] { display: none; }

    /* ================= 【第二頁：最大化取景窗全螢幕相機 (直式 / 橫式自動適配 · 原生4:3 · 多鏡頭)】 ================= */
    #pageShooting {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #FFFFFF;
      background-size: cover;
      z-index: 900;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .shooting-layout {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* 🟥【取景窗最大化】：直式佔約 80%，橫式吃滿 100% 螢幕全高 */
    .camera-left-col {
      flex: 1;
      width: 100%;
      min-height: 0;
      min-width: 0;
      position: relative;
      background: #101311;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cameraContainer {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101311;
      display: block;
    }

    /* 浮動在取景窗頂部的半透明資訊列 */
    .floating-top-bar {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .floating-vendor-pill {
      background: rgba(25, 38, 28, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #FFFFFF;
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .floating-shot-pill {
      background: rgba(255, 248, 238, 0.92);
      color: #D96B12;
      padding: 4px 11px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 900;
      border: 1.5px solid #F5C492;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    #flashOverlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #FFFFFF; opacity: 0; pointer-events: none; transition: opacity 0.12s;
      z-index: 15;
    }

    /* 🟠【左下角極簡橘色小圓圈鏡頭切換鈕】：直徑 44px，極低畫面佔比 */
    .lens-circle-btn {
      position: absolute;
      bottom: 8px;
      left: 10px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid #F58820;
      background: rgba(24, 19, 15, 0.74);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: #FFB85C;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 12;
      user-select: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.42);
      transition: transform 0.08s;
    }
    .lens-circle-btn:active {
      transform: scale(0.90);
    }
    .lens-circle-btn.is-wide {
      background: rgba(245, 136, 32, 0.90);
      color: #FFFFFF;
      border-color: #FFE0B8;
    }

    .landscape-guide {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.62); color: #FFFFFF;
      font-size: 11px; font-weight: bold; padding: 4px 9px; border-radius: 10px;
      pointer-events: none; z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* 控制群組 (直式在下方，橫式自動切換至右側直排) */
    .controls-right-col {
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: #FFFFFF;
      background-size: cover;
      flex-shrink: 0;
    }

    /* 🟦【藍框區】：精簡小縮圖與狀態提示 */
    .blue-info-strip {
      width: 100%;
      height: 8dvh;
      min-height: 44px;
      max-height: 54px;
      padding: 3px 10px;
      background-color: #F4F9F5;
      background-size: cover;
      border-top: 1.5px solid #D5E6D7;
      border-bottom: 1.5px solid #E4EDE5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .thumb-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      height: 100%;
      flex: 1;
      min-width: 0;
      padding: 1px 0;
    }
    .thumb-empty-hint {
      font-size: 11px;
      color: #7A9480;
      font-weight: bold;
      white-space: nowrap;
    }
    .thumb-item {
      height: 36px;
      width: auto;
      max-width: 52px;
      border-radius: 6px;
      object-fit: cover;
      border: 2px solid #78B280;
      flex-shrink: 0;
    }

    .status-box {
      font-size: 11px;
      font-weight: bold;
      text-align: right;
      padding: 4px 8px;
      border-radius: 10px;
      background-color: #E8F4EA;
      background-size: cover;
      color: #285A34;
      border: 1px solid #C2DEC5;
      max-width: 56%;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* 🟧＋🟩【操作控制列】：直式置底，橫式自動切換為最右側直排 */
    .bottom-control-bar {
      width: 100%;
      height: 13dvh;
      min-height: 78px;
      max-height: 94px;
      padding: 4px 22px calc(4px + env(safe-area-inset-bottom)) 22px;
      background-color: #FFFFFF;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-action-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
      width: 74px;
    }
    .btn-back-square {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background-color: #EBF7EC;
      background-size: cover;
      border: 2px solid #5EA869;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(94, 168, 105, 0.22);
      transition: transform 0.1s;
    }
    .side-action-wrap:active .btn-back-square,
    .side-action-wrap:active .btn-rotate-square {
      transform: scale(0.92);
    }
    .side-action-label {
      font-size: 10px;
      font-weight: 800;
      color: #36583D;
      white-space: nowrap;
    }

    /* 🟧 亮橘色雙層圓形快門鈕 */
    .shutter-outer-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 3.5px solid #F58820;
      background-color: #FFF7F0;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(245, 136, 32, 0.42);
      user-select: none;
      transition: transform 0.08s;
      flex-shrink: 0;
    }
    .shutter-outer-ring:active {
      transform: scale(0.91);
    }
    .shutter-inner-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFB347 0%, #F27405 100%);
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45);
    }
    .shutter-center-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid #FFFFFF;
      opacity: 0.92;
    }

    .btn-rotate-square {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background-color: #EBF4FA;
      background-size: cover;
      border: 2px solid #7EB6D9;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(126, 182, 217, 0.22);
      transition: transform 0.1s;
    }

    /* ================= 【橫式原生相機自動適配：開啟自動旋轉並打橫時觸發】 ================= */
    @media (orientation: landscape) {
      body {
        justify-content: flex-start;
      }

      .shooting-layout {
        flex-direction: row;
      }

      .camera-left-col {
        width: auto;
        height: 100%;
      }

      .floating-top-bar {
        top: 8px;
        left: max(10px, env(safe-area-inset-left));
        right: 10px;
      }

      .lens-circle-btn {
        bottom: 10px;
        left: max(12px, env(safe-area-inset-left));
      }

      .controls-right-col {
        width: auto;
        height: 100%;
        flex-direction: row;
      }

      .blue-info-strip {
        width: 62px;
        height: 100%;
        min-height: 0;
        max-height: none;
        padding: 8px 4px;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        border-top: none;
        border-bottom: none;
        border-left: 1.5px solid #D5E6D7;
        border-right: 1.5px solid #E4EDE5;
      }

      .thumb-strip {
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        width: 100%;
        height: auto;
        align-items: center;
        gap: 5px;
      }

      .thumb-empty-hint {
        font-size: 10px;
        white-space: normal;
        text-align: center;
        line-height: 1.3;
      }

      .thumb-item {
        width: 50px;
        height: 38px;
        max-width: 50px;
      }

      .status-box {
        max-width: 100%;
        width: 54px;
        font-size: 9px;
        text-align: center;
        padding: 4px 2px;
        white-space: normal;
        word-break: break-all;
        line-height: 1.2;
      }

      /* 右側直排操作列：上=自動方向、中=亮橘色大快門、下=返回首頁 */
      .bottom-control-bar {
        width: auto;
        min-width: 84px;
        height: 100%;
        min-height: 0;
        max-height: none;
        padding: 12px calc(10px + env(safe-area-inset-right)) 12px 10px;
        flex-direction: column-reverse;
        justify-content: space-between;
        align-items: center;
      }

      .side-action-wrap {
        width: 64px;
      }
    }
  </style>
</head>
<body>

  <!-- ================= 【第一頁：選擇拍攝類別與廠商頁面】 ================= -->
  <div id="pageSelectVendor" class="card card-hero">
    <div class="dots"><div class="dot-orange"></div><div class="dot-blue"></div></div>
    <h2>旺邦營造 · 現場拍照系統</h2>

    <label class="sec-title">1. 請選擇拍攝類別</label>
    <select id="photoTypeSelect" onchange="onPhotoTypeChange()">
      <option value="WORKER">👷 拍攝工班出工照片 (危害告知)</option>
      <option value="RAT">🐭 拍攝鼠患檢查照片 (環境稽查)</option>
    </select>

    <div id="workerConfigBox" class="sub-box">
      <div class="sec-title-row">
        <label class="sec-title" style="margin-bottom:0;">2. 請選擇要拍攝的出工廠商</label>
        <span id="vendorSyncBadge" class="sync-badge">☁️ 同步清單中...</span>
      </div>
      <select id="vendorSelect" onchange="onVendorChange()">
        <option value="力陞">力陞</option>
        <option value="上承">上承</option>
        <option value="井帝">井帝</option>
        <option value="天盛">天盛</option>
        <option value="弘佾">弘佾</option>
        <option value="全暐">全暐</option>
        <option value="昇萌">昇萌</option>
        <option value="長和">長和</option>
        <option value="春豐">春豐</option>
        <option value="時勝">時勝</option>
        <option value="海納">海納</option>
        <option value="勝順">勝順</option>
        <option value="筌幄">筌幄</option>
        <option value="源鴻">源鴻</option>
        <option value="鼎創">鼎創</option>
        <option value="樹花園">樹花園</option>
        <option value="燕銘">燕銘</option>
        <option value="鎮遠">鎮遠</option>
        <option value="繽紛">繽紛</option>
        <option value="__CUSTOM__">➕ 手動輸入其他廠商...</option>
      </select>

      <input type="text" id="customVendorInput" placeholder="請輸入新廠商名稱 (將自動同步至NAS)" style="display:none;">
      <div id="shiftBtn" class="shift-pill" onclick="toggleShift()">☀️ 目前模式：日班 (點此切換夜班)</div>
    </div>

    <div id="ratConfigBox" class="sub-box" style="display:none; text-align:center;">
      <div style="font-size:17px; font-weight:bold; color:#2B5434; margin-bottom:6px;">🐭 鼠患防治環境稽查模式</div>
      <div style="font-size:13px; color:#4A6350; line-height:1.5;">
        免選廠商！進入相機後可在同一地點連拍幾張，<br>接著直接走到下一地點繼續拍，AI 會自動分類地點！
      </div>
    </div>

    <div id="btnStartShoot" class="btn-orange-huge" onclick="startGroupShooting()">📷 開始拍攝這組工班</div>

    <div id="btnGalleryHome" class="btn-blue-home" onclick="triggerHomeGallery()">🖼️ 或從相簿勾選照片直接上傳</div>
    <input type="file" id="galleryInput" accept="image/*" multiple onchange="handleGalleryFiles(this.files)">

    <div id="homeStatusBox" class="home-status-box"></div>
  </div>

  <!-- ================= 【第二頁：最大化取景窗連拍介面】 ================= -->
  <div id="pageShooting">
    <div class="shooting-layout">
      <!-- 🟥 取景窗最大化區域 -->
      <div class="camera-left-col">
        <div id="cameraContainer">
          <div class="floating-top-bar">
            <div id="shootingVendorTitle" class="floating-vendor-pill">👷 弘佾 (日班)</div>
            <div id="shotCounterText" class="floating-shot-pill">📸 已拍 0 張</div>
          </div>

          <video id="cameraVideo" autoplay playsinline muted></video>
          <div id="flashOverlay"></div>

          <!-- 🟠 左下角迷你橘色圓形鏡頭切換鈕 (0.5x / 1x / 多鏡頭) -->
          <div id="lensCircleBtn" class="lens-circle-btn" onclick="cycleCameraLens()" title="切換廣角 / 標準鏡頭">1x</div>

          <div id="poseGuideBadge" class="landscape-guide">📐 自動偵測：橫拍(頂朝左)</div>
        </div>
      </div>

      <!-- 控制群組 (直式在下方，橫式自動切換為右側直排) -->
      <div id="controlsRightCol" class="controls-right-col">
        <div id="blueInfoStrip" class="blue-info-strip">
          <div id="thumbStrip" class="thumb-strip">
            <span class="thumb-empty-hint">📷 按快門連拍</span>
          </div>
          <div id="statusBox" class="status-box">🟢 真實時間＋4:3廣角</div>
        </div>

        <div id="bottomControlBar" class="bottom-control-bar">
          <div class="side-action-wrap" onclick="finishGroupAndReturn()" title="完成並返回首頁">
            <div id="btnFinishGroup" class="btn-back-square">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E6F3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4" ry="4" stroke-opacity="0.35"></rect>
                <path d="M15 12H8"></path>
                <path d="M11.5 8.5L8 12l3.5 3.5"></path>
              </svg>
            </div>
            <span class="side-action-label">返回首頁</span>
          </div>

          <div id="shutterBtn" class="shutter-outer-ring" onclick="takeInstantShot()" title="按下快門連拍">
            <div id="shutterInner" class="shutter-inner-circle">
              <div class="shutter-center-dot"></div>
            </div>
          </div>

          <div class="side-action-wrap" onclick="cyclePhotoPoseMode()" title="切換照片方向模式">
            <div id="btnRotateSquare" class="btn-rotate-square">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24526E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="6" width="16" height="12" rx="2.5"></rect>
                <path d="M9 12h6"></path>
                <path d="M13 9.5L15.5 12 13 14.5"></path>
              </svg>
            </div>

          </div>

  <!-- 畫面旋轉暫存與最終輸出 Canvas -->
  <canvas id="orientCanvas" style="display:none;"></canvas>
  <canvas id="watermarkCanvas" style="display:none;"></canvas>

  <script>
    // ✅ 您專屬的 Google Apps Script 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxRi29SB802ZJSssGKp8Ki6-g-dx3VvVVkMO857_kum88V-FC2KhEqCj4IZKMPcYQcn/exec";

    const DEFAULT_VENDORS = [
      "力陞", "上承", "井帝", "天盛", "弘佾", "全暐", "昇萌", "長和", "春豐",
      "時勝", "海納", "勝順", "筌幄", "源鴻", "鼎創", "樹花園", "燕銘",
      "鎮遠", "繽紛"
    ];

    let currentPhotoType = "WORKER";
    let isNightMode = false;
    let currentGroupShots = 0;
    let activeUploads = 0;
    let videoStream = null;

    // 防同秒撞名集合
    const usedTimeStrSet = new Set();

    // 🌟 多鏡頭調度狀態 (預設優先超廣角 0.5x)
    let availableLenses = [];
    let currentLensIdx = 0;
    let lensesDiscovered = false;
    let isSwitchingLens = false;

    // 🌟 智慧照片方向偵測狀態
    let photoPoseMode = "AUTO";
    let detectedPhysicalPose = "LANDSCAPE_LEFT";
    let orientationListenerInitialized = false;

    function makeGradientPng(c1, c2) {
      const c = document.createElement("canvas");
      c.width = 60; c.height = 60;
      const ctx = c.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, 60, 60);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2 || c1);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 60, 60);
      return "url(" + c.toDataURL("image/png") + ")";
    }

    function applyBrightThemeBitmaps() {
      document.body.style.backgroundImage = makeGradientPng("#F4F2EC", "#F4F2EC");
      document.getElementById("pageSelectVendor").style.backgroundImage = makeGradientPng("#D2EBD0", "#C2E5F5");
      document.getElementById("pageShooting").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("controlsRightCol").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("blueInfoStrip").style.backgroundImage = makeGradientPng("#F4F9F5", "#F4F9F5");
      document.getElementById("bottomControlBar").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("photoTypeSelect").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("vendorSelect").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("customVendorInput").style.backgroundImage = makeGradientPng("#FFFFFF", "#FFFFFF");
      document.getElementById("shiftBtn").style.backgroundImage = makeGradientPng("#FFF9EC", "#FFF9EC");
      document.getElementById("btnStartShoot").style.backgroundImage = makeGradientPng("#FAD09C", "#F0A35E");
      document.getElementById("btnGalleryHome").style.backgroundImage = makeGradientPng("#D0ECFA", "#9BCDE6");
      document.getElementById("homeStatusBox").style.backgroundImage = makeGradientPng("#F0F7F0", "#F0F7F0");
      document.getElementById("shutterBtn").style.backgroundImage = makeGradientPng("#FFF7F0", "#FFF7F0");
      document.getElementById("shutterInner").style.backgroundImage = makeGradientPng("#FFB347", "#F27405");
      document.getElementById("btnFinishGroup").style.backgroundImage = makeGradientPng("#EBF7EC", "#D8F0DA");
      document.getElementById("btnRotateSquare").style.backgroundImage = makeGradientPng("#EBF4FA", "#DAECF7");
      document.getElementById("statusBox").style.backgroundImage = makeGradientPng("#E8F4EA", "#E8F4EA");
    }

    // ================= [多鏡頭偵測與原生 4:3 超廣角切換引擎] =================
    function stopCurrentStream() {
      if (videoStream) {
        try {
          videoStream.getTracks().forEach(t => t.stop());
        } catch (e) {}
        videoStream = null;
      }
    }

    async function openCameraStream(deviceId) {
      const primaryVideo = {
        width: { ideal: 1600 },
        height: { ideal: 1200 },
        aspectRatio: { ideal: 4 / 3 }
      };
      if (deviceId) {
        primaryVideo.deviceId = { exact: deviceId };
      } else {
        primaryVideo.facingMode = { ideal: "environment" };
      }

      try {
        return await navigator.mediaDevices.getUserMedia({ video: primaryVideo, audio: false });
      } catch (e1) {
        const fallbackVideo = deviceId
          ? { deviceId: { exact: deviceId } }
          : { facingMode: { ideal: "environment" } };
        return await navigator.mediaDevices.getUserMedia({ video: fallbackVideo, audio: false });
      }
    }

    function attachStreamToVideo(stream) {
      videoStream = stream;
      const video = document.getElementById("cameraVideo");
      video.srcObject = stream;
      try {
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }
      } catch (e) {}
    }

    function updateLensButtonUI() {
      const btn = document.getElementById("lensCircleBtn");
      if (!btn) return;
      const cur = availableLenses[currentLensIdx];
      if (!cur) {
        btn.innerText = "1x";
        btn.classList.remove("is-wide");
        return;
      }
      btn.innerText = cur.shortLabel;
      if (cur.isUltraWide) {
        btn.classList.add("is-wide");
      } else {
        btn.classList.remove("is-wide");
      }
    }

    async function discoverRearLenses(activeStream) {
      const track = activeStream ? activeStream.getVideoTracks()[0] : null;
      const activeSettings = (track && typeof track.getSettings === "function") ? track.getSettings() : {};
      const activeDeviceId = activeSettings.deviceId || "";
      const activeCaps = (track && typeof track.getCapabilities === "function") ? track.getCapabilities() : {};

      let devices = [];
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        devices = all.filter(d => d.kind === "videoinput");
      } catch (e) {}

      const frontRegex = /front|user|selfie|facetime|前置|前鏡頭|前置鏡頭/i;
      const deskRegex = /desk\s*view|桌上視角|continuity/i;
      const ultraRegex = /ultra\s*wide|0\.5|超廣角|超广角/i;
      const teleRegex = /telephoto|望遠|望远|長焦|长焦/i;
      const virtualRegex = /dual|triple|雙鏡頭|三鏡頭|双摄|三摄/i;
      const mainWideRegex = /^back\s*camera$|^back\s*wide|後置相機|後置廣角|camera2\s*0/i;

      const rearDevices = devices.filter(d => {
        const lbl = d.label || "";
        if (d.deviceId === activeDeviceId) return true;
        if (frontRegex.test(lbl) || deskRegex.test(lbl)) return false;
        return true;
      });

      let ultraList = [];
      let mainList = [];
      let otherRearList = [];

      rearDevices.forEach(d => {
        const lbl = d.label || "";
        if (ultraRegex.test(lbl)) {
          ultraList.push({
            kind: "device",
            deviceId: d.deviceId,
            shortLabel: "0.5x",
            rawLabel: lbl || "超廣角鏡頭",
            isUltraWide: true
          });
        } else if (mainWideRegex.test(lbl) || (d.deviceId === activeDeviceId && !teleRegex.test(lbl) && !virtualRegex.test(lbl))) {
          mainList.push({
            kind: "device",
            deviceId: d.deviceId,
            shortLabel: "1x",
            rawLabel: lbl || "主鏡頭",
            isUltraWide: false
          });
        } else if (!virtualRegex.test(lbl) && !teleRegex.test(lbl)) {
          otherRearList.push({
            kind: "device",
            deviceId: d.deviceId,
            shortLabel: "",
            rawLabel: lbl || "後置鏡頭",
            isUltraWide: false
          });
        }
      });

      const lenses = [];

      if (ultraList.length > 0) {
        lenses.push(ultraList[0]);
      }

      if (ultraList.length === 0 && activeCaps && activeCaps.zoom && typeof activeCaps.zoom.min === "number" && activeCaps.zoom.min < 0.95) {
        const minZ = Math.max(0.5, Math.round(activeCaps.zoom.min * 10) / 10);
        lenses.push({
          kind: "zoom",
          deviceId: activeDeviceId,
          zoomValue: minZ,
          shortLabel: `${minZ}x`,
          rawLabel: `光學廣角 (${minZ}x)`,
          isUltraWide: true
        });
      }

      if (mainList.length > 0) {
        const activeMain = mainList.find(m => m.deviceId === activeDeviceId) || mainList[0];
        lenses.push(activeMain);
      } else if (activeDeviceId) {
        lenses.push({
          kind: "device",
          deviceId: activeDeviceId,
          shortLabel: "1x",
          rawLabel: "主鏡頭",
          isUltraWide: false
        });
      }

      if (ultraList.length === 0 && otherRearList.length > 0) {
        let extraNum = 2;
        otherRearList.forEach(item => {
          if (!lenses.some(l => l.kind === "device" && l.deviceId === item.deviceId)) {
            item.shortLabel = `L${extraNum}`;
            extraNum++;
            lenses.push(item);
          }
        });
      }

      if (lenses.length === 0) {
        lenses.push({
          kind: "device",
          deviceId: activeDeviceId,
          shortLabel: "1x",
          rawLabel: "預設後置鏡頭",
          isUltraWide: false
        });
      }

      availableLenses = lenses;
      lensesDiscovered = true;

      const activeIdx = availableLenses.findIndex(l => l.kind === "device" && l.deviceId === activeDeviceId);
      currentLensIdx = (activeIdx >= 0) ? activeIdx : 0;

      const ultraIdx = availableLenses.findIndex(l => l.isUltraWide);
      let targetIdx = currentLensIdx;

      if (ultraIdx >= 0) {
        targetIdx = ultraIdx;
      } else {
        const savedLabel = localStorage.getItem("wb_preferred_lens_raw");
        if (savedLabel) {
          const savedIdx = availableLenses.findIndex(l => l.rawLabel === savedLabel);
          if (savedIdx >= 0) targetIdx = savedIdx;
        }
      }

      if (targetIdx !== currentLensIdx) {
        await switchToLensIndex(targetIdx, true);
      } else {
        updateLensButtonUI();
        const cur = availableLenses[currentLensIdx];
        if (cur) {
          updateStatusDisplay(`🔭 ${cur.shortLabel}｜共 ${availableLenses.length} 顆鏡頭`);
        }
      }
    }

    async function switchToLensIndex(targetIdx, isAutoDefault) {
      if (isSwitchingLens || !availableLenses[targetIdx]) return;
      const target = availableLenses[targetIdx];
      const prevIdx = currentLensIdx;
      isSwitchingLens = true;

      const btn = document.getElementById("lensCircleBtn");
      if (btn) btn.innerText = "...";

      try {
        if (target.kind === "zoom") {
          const track = videoStream ? videoStream.getVideoTracks()[0] : null;
          if (!track || track.readyState === "ended") {
            stopCurrentStream();
            const freshStream = await openCameraStream(target.deviceId || null);
            attachStreamToVideo(freshStream);
          }
          const activeTrack = videoStream.getVideoTracks()[0];
          await activeTrack.applyConstraints({ advanced: [{ zoom: target.zoomValue }] });
          currentLensIdx = targetIdx;
        } else {
          const prevTrack = videoStream ? videoStream.getVideoTracks()[0] : null;
          const prevSettings = (prevTrack && typeof prevTrack.getSettings === "function") ? prevTrack.getSettings() : {};
          if (prevTrack && prevTrack.readyState === "live" && prevSettings.deviceId === target.deviceId) {
            const caps = (typeof prevTrack.getCapabilities === "function") ? prevTrack.getCapabilities() : {};
            if (caps && caps.zoom) {
              try {
                await prevTrack.applyConstraints({ advanced: [{ zoom: 1.0 }] });
              } catch (e) {}
            }
            currentLensIdx = targetIdx;
          } else {
            stopCurrentStream();
            const newStream = await openCameraStream(target.deviceId);
            attachStreamToVideo(newStream);
            currentLensIdx = targetIdx;
          }
        }

        if (!isAutoDefault) {
          try {
            localStorage.setItem("wb_preferred_lens_raw", target.rawLabel);
          } catch (e) {}
        }

        updateLensButtonUI();
        const shortDesc = target.rawLabel.length > 22 ? target.rawLabel.slice(0, 22) : target.rawLabel;
        updateStatusDisplay(`🔭 ${target.shortLabel} (${shortDesc})`);
      } catch (err) {
        console.warn("切換鏡頭失敗，自動還原:", err);
        currentLensIdx = prevIdx;
        if (!videoStream || !videoStream.getVideoTracks().length || videoStream.getVideoTracks()[0].readyState === "ended") {
          try {
            const recoverStream = await openCameraStream(null);
            attachStreamToVideo(recoverStream);
          } catch (e2) {}
        }
        updateLensButtonUI();
        updateStatusDisplay("⚠️ 已維持原鏡頭");
      } finally {
        isSwitchingLens = false;
      }
    }

    function cycleCameraLens() {
      if (isSwitchingLens) return;
      if (availableLenses.length <= 1) {
        updateStatusDisplay("ℹ️ 僅開放 1 顆後置鏡頭 (4:3寬視野)");
        return;
      }
      const nextIdx = (currentLensIdx + 1) % availableLenses.length;
      switchToLensIndex(nextIdx, false);
    }

    // ================= [重力感應器：無懼「螢幕直向鎖定」即時判斷手機握持方向] =================
    function initOrientationSensor() {
      if (orientationListenerInitialized) return;

      const handleOrientation = function(e) {
        if (e.beta === null || e.gamma === null) return;
        const radBeta = e.beta * (Math.PI / 180);
        const radGamma = e.gamma * (Math.PI / 180);

        const gx = -Math.cos(radBeta) * Math.sin(radGamma);
        const gy = -Math.sin(radBeta);

        if (Math.abs(gx) < 0.30 && Math.abs(gy) < 0.30) return;

        let newPose = detectedPhysicalPose;
        if (Math.abs(gx) > Math.abs(gy) * 1.15) {
          newPose = (gx > 0) ? "LANDSCAPE_LEFT" : "LANDSCAPE_RIGHT";
        } else if (Math.abs(gy) > Math.abs(gx) * 1.15) {
          newPose = "PORTRAIT";
        }

        if (newPose !== detectedPhysicalPose) {
          detectedPhysicalPose = newPose;
          updatePoseBadgeUI();
        }
      };

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === "granted") {
              window.addEventListener("deviceorientation", handleOrientation, true);
              orientationListenerInitialized = true;
            }
          })
          .catch(() => {});
      } else if (typeof window.DeviceOrientationEvent !== "undefined") {
        window.addEventListener("deviceorientation", handleOrientation, true);
        orientationListenerInitialized = true;
      }
    }

    function getEffectivePose() {
      return (photoPoseMode === "AUTO") ? detectedPhysicalPose : photoPoseMode;
    }

    function updatePoseBadgeUI() {
      const badge = document.getElementById("poseGuideBadge");
      const label = document.getElementById("poseModeLabel");
      const eff = getEffectivePose();

      let poseText = "橫拍(頂朝左 4:3)";
      if (eff === "LANDSCAPE_RIGHT") poseText = "橫拍(頂朝右 4:3)";
      else if (eff === "PORTRAIT") poseText = "直拍(3:4直式)";

      if (photoPoseMode === "AUTO") {
        if (badge) badge.innerText = `📐 自動偵測：${poseText}`;
        if (label) label.innerText = "自動方向";
      } else {
        if (badge) badge.innerText = `🔒 已鎖定：${poseText}`;
        if (eff === "LANDSCAPE_LEFT") label.innerText = "鎖定橫(左)";
        else if (eff === "PORTRAIT") label.innerText = "鎖定直式";
        else label.innerText = "鎖定橫(右)";
      }
    }

    function cyclePhotoPoseMode() {
      const modes = ["AUTO", "LANDSCAPE_LEFT", "PORTRAIT", "LANDSCAPE_RIGHT"];
      const idx = modes.indexOf(photoPoseMode);
      photoPoseMode = modes[(idx + 1) % modes.length];
      updatePoseBadgeUI();
    }

    // ================= [廠商清單渲染與雲端 NAS 自動同步] =================
    function getCachedVendorList() {
      try {
        const raw = localStorage.getItem("wb_vendor_list_cache");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {}
      return DEFAULT_VENDORS.slice();
    }

    function renderVendorOptions(vendorList, preferredVendor) {
      if (!Array.isArray(vendorList) || vendorList.length === 0) return;

      const sel = document.getElementById("vendorSelect");
      const customInp = document.getElementById("customVendorInput");
      const wasCustomMode = (sel.value === "__CUSTOM__") && !preferredVendor;
      const targetSelect = preferredVendor || sel.value || localStorage.getItem("wb_last_vendor") || vendorList[0];

      const cleanList = [];
      const seen = {};
      for (let i = 0; i < vendorList.length; i++) {
        const v = String(vendorList[i] || "").trim();
        if (v && v !== "__CUSTOM__" && v !== "鼠患檢查" && v !== "未命名廠商" && !seen[v]) {
          seen[v] = true;
          cleanList.push(v);
        }
      }

      try {
        localStorage.setItem("wb_vendor_list_cache", JSON.stringify(cleanList));
      } catch (e) {}

      sel.innerHTML = "";
      for (let i = 0; i < cleanList.length; i++) {
        const opt = document.createElement("option");
        opt.value = cleanList[i];
        opt.textContent = cleanList[i];
        sel.appendChild(opt);
      }

      const customOpt = document.createElement("option");
      customOpt.value = "__CUSTOM__";
      customOpt.textContent = "➕ 手動輸入其他廠商...";
      sel.appendChild(customOpt);

      if (wasCustomMode) {
        sel.value = "__CUSTOM__";
        customInp.style.display = "block";
      } else if (seen[targetSelect]) {
        sel.value = targetSelect;
        customInp.style.display = "none";
        localStorage.setItem("wb_last_vendor", targetSelect);
      } else if (cleanList.length > 0) {
        sel.value = cleanList[0];
        customInp.style.display = "none";
        localStorage.setItem("wb_last_vendor", cleanList[0]);
      }
    }

    function syncVendorsFromCloud() {
      const badge = document.getElementById("vendorSyncBadge");
      if (badge) badge.innerText = "☁️ 同步清單中...";

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "GET_VENDORS" })
      })
      .then(r => r.json())
      .then(res => {
        if (res && res.success && Array.isArray(res.vendors) && res.vendors.length > 0) {
          renderVendorOptions(res.vendors);
          if (badge) badge.innerText = `☁️ 已同步 NAS (${res.vendors.length}家)`;
        } else {
          if (badge) badge.innerText = "☁️ 已載入廠商清單";
        }
      })
      .catch(() => {
        if (badge) badge.innerText = "☁️ 離線快取清單";
      });
    }

    function pushNewVendorToCloud(newVendorName) {
      const cleanName = String(newVendorName || "").trim();
      if (!cleanName || cleanName === "__CUSTOM__" || cleanName === "鼠患檢查") return;

      const currentList = getCachedVendorList();
      if (currentList.indexOf(cleanName) === -1) {
        currentList.push(cleanName);
      }
      renderVendorOptions(currentList, cleanName);
      document.getElementById("customVendorInput").value = "";

      const badge = document.getElementById("vendorSyncBadge");
      if (badge) badge.innerText = `☁️ 正在同步「${cleanName}」...`;

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "ADD_VENDOR",
          vendorName: cleanName
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res && res.success && Array.isArray(res.vendors)) {
          renderVendorOptions(res.vendors, cleanName);
          if (badge) badge.innerText = `☁️ 已同步 NAS (${res.vendors.length}家)`;
        }
      })
      .catch(() => {});
    }

    window.onload = function() {
      applyBrightThemeBitmaps();
      const cachedList = getCachedVendorList();
      const savedVendor = localStorage.getItem("wb_last_vendor");
      renderVendorOptions(cachedList, savedVendor);
      syncVendorsFromCloud();
      updatePoseBadgeUI();
    };

    function onPhotoTypeChange() {
      currentPhotoType = document.getElementById("photoTypeSelect").value;
      const workerBox = document.getElementById("workerConfigBox");
      const ratBox = document.getElementById("ratConfigBox");
      const startBtn = document.getElementById("btnStartShoot");

      if (currentPhotoType === "RAT") {
        workerBox.style.display = "none";
        ratBox.style.display = "block";
        startBtn.innerText = "📷 開始拍攝鼠患檢查照片";
      } else {
        workerBox.style.display = "block";
        ratBox.style.display = "none";
        startBtn.innerText = "📷 開始拍攝這組工班";
      }
    }

    function onVendorChange() {
      const val = document.getElementById("vendorSelect").value;
      const customInp = document.getElementById("customVendorInput");
      if (val === "__CUSTOM__") {
        customInp.style.display = "block";
        customInp.focus();
      } else {
        customInp.style.display = "none";
        localStorage.setItem("wb_last_vendor", val);
      }
    }

    function toggleShift() {
      isNightMode = !isNightMode;
      const btn = document.getElementById("shiftBtn");
      if (isNightMode) {
        btn.className = "shift-pill night";
        btn.style.backgroundImage = makeGradientPng("#4A6274", "#394E5E");
        btn.innerText = "🌙 目前模式：夜班 (點此切換日班)";
      } else {
        btn.className = "shift-pill";
        btn.style.backgroundImage = makeGradientPng("#FFF9EC", "#FFF9EC");
        btn.innerText = "☀️ 目前模式：日班 (點此切換夜班)";
      }
    }

    function getSelectedVendor() {
      if (currentPhotoType === "RAT") return "鼠患檢查";
      const sel = document.getElementById("vendorSelect").value;
      if (sel === "__CUSTOM__") {
        return document.getElementById("customVendorInput").value.trim();
      }
      return sel;
    }

    function triggerHomeGallery() {
      const isCustomSelected = (currentPhotoType === "WORKER" && document.getElementById("vendorSelect").value === "__CUSTOM__");
      const vendor = getSelectedVendor();
      if (!vendor) {
        alert("請先選擇或輸入廠商名稱，再從相簿選圖！");
        return;
      }
      if (isCustomSelected) {
        pushNewVendorToCloud(vendor);
      } else if (currentPhotoType === "WORKER") {
        localStorage.setItem("wb_last_vendor", vendor);
      }
      document.getElementById("galleryInput").click();
    }

    async function startGroupShooting() {
      const isCustomSelected = (currentPhotoType === "WORKER" && document.getElementById("vendorSelect").value === "__CUSTOM__");
      const vendor = getSelectedVendor();
      if (!vendor) {
        alert("請先選擇或輸入廠商名稱！");
        return;
      }

      initOrientationSensor();

      if (isCustomSelected) {
        pushNewVendorToCloud(vendor);
      } else if (currentPhotoType === "WORKER") {
        localStorage.setItem("wb_last_vendor", vendor);
      }

      currentGroupShots = 0;
      document.getElementById("thumbStrip").innerHTML = '<span class="thumb-empty-hint">📷 按快門連拍</span>';

      if (currentPhotoType === "RAT") {
        document.getElementById("shootingVendorTitle").innerText = "🐭 鼠患防治檢查";
      } else {
        const shiftStr = isNightMode ? "夜班" : "日班";
        document.getElementById("shootingVendorTitle").innerText = `👷 ${vendor} (${shiftStr})`;
      }
      updateShootingUI();
      updatePoseBadgeUI();

      document.getElementById("pageSelectVendor").style.display = "none";
      document.getElementById("pageShooting").style.display = "flex";

      try {
        const needStart = !videoStream || !videoStream.getVideoTracks().length || videoStream.getVideoTracks()[0].readyState === "ended";
        if (needStart) {
          const initialStream = await openCameraStream(null);
          attachStreamToVideo(initialStream);
          if (!lensesDiscovered) {
            await discoverRearLenses(initialStream);
          } else if (availableLenses[currentLensIdx]) {
            await switchToLensIndex(currentLensIdx, true);
          }
        } else {
          updateLensButtonUI();
        }
      } catch (err) {
        alert("無法啟動鏡頭，請確認允許相機權限：" + err);
      }
    }

    function finishGroupAndReturn() {
      currentGroupShots = 0;
      document.getElementById("pageShooting").style.display = "none";
      document.getElementById("pageSelectVendor").style.display = "block";
      syncVendorsFromCloud();
    }

    function updateShootingUI() {
      document.getElementById("shotCounterText").innerText = `📸 已拍 ${currentGroupShots} 張`;
    }

    // ================= [真實時間處理、相簿原圖 EXIF 讀取與防撞名] =================
    function formatTaiwanTimeStr(epochMs) {
      const twDate = new Date(epochMs + (8 * 3600 * 1000));
      const yyyy = twDate.getUTCFullYear();
      const mm = String(twDate.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(twDate.getUTCDate()).padStart(2, '0');
      const hh = String(twDate.getUTCHours()).padStart(2, '0');
      const min = String(twDate.getUTCMinutes()).padStart(2, '0');
      const ss = String(twDate.getUTCSeconds()).padStart(2, '0');
      return `${yyyy}${mm}${dd}_${hh}${min}${ss}`;
    }

    function formatTaiwanWatermarkDate(epochMs) {
      const twDate = new Date(epochMs + (8 * 3600 * 1000));
      const yyyy = twDate.getUTCFullYear();
      const mm = String(twDate.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(twDate.getUTCDate()).padStart(2, '0');
      return `${yyyy}/${mm}/${dd}`;
    }

    function allocateUniqueEpochMs(baseEpochMs) {
      let ep = (typeof baseEpochMs === "number" && !isNaN(baseEpochMs) && baseEpochMs > 0) ? baseEpochMs : Date.now();
      while (usedTimeStrSet.has(formatTaiwanTimeStr(ep))) {
        ep += 1000;
      }
      usedTimeStrSet.add(formatTaiwanTimeStr(ep));
      return ep;
    }

    function extractOriginalEpochFromDataUrl(dataUrl, fallbackEpochMs) {
      try {
        if (typeof piexif !== "undefined" && typeof dataUrl === "string" &&
            (dataUrl.indexOf("data:image/jpeg") === 0 || dataUrl.indexOf("data:image/jpg") === 0)) {
          const exifObj = piexif.load(dataUrl);
          const rawDt =
            (exifObj && exifObj["Exif"] && exifObj["Exif"][piexif.ExifIFD.DateTimeOriginal]) ||
            (exifObj && exifObj["Exif"] && exifObj["Exif"][piexif.ExifIFD.DateTimeDigitized]) ||
            (exifObj && exifObj["0th"] && exifObj["0th"][piexif.ImageIFD.DateTime]);
          if (rawDt) {
            const m = String(rawDt).trim().match(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if (m) {
              const y = parseInt(m[1], 10);
              const mo = parseInt(m[2], 10);
              const d = parseInt(m[3], 10);
              const hh = parseInt(m[4], 10);
              const mm = parseInt(m[5], 10);
              const ss = parseInt(m[6], 10);
              if (y >= 2020 && y <= 2035 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
                return Date.UTC(y, mo - 1, d, hh, mm, ss) - (8 * 3600 * 1000);
              }
            }
          }
        }
      } catch (e) {
        console.warn("原圖 EXIF 讀取略過:", e);
      }
      return (typeof fallbackEpochMs === "number" && fallbackEpochMs > 0) ? fallbackEpochMs : Date.now();
    }

    function injectExifDateTime(jpegDataUrl, epochMs) {
      try {
        if (typeof piexif === "undefined") return jpegDataUrl;
        const twDate = new Date(epochMs + (8 * 3600 * 1000));
        const yyyy = twDate.getUTCFullYear();
        const mm = String(twDate.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(twDate.getUTCDate()).padStart(2, '0');
        const hh = String(twDate.getUTCHours()).padStart(2, '0');
        const min = String(twDate.getUTCMinutes()).padStart(2, '0');
        const ss = String(twDate.getUTCSeconds()).padStart(2, '0');
        const exifTimeStr = `${yyyy}:${mm}:${dd} ${hh}:${min}:${ss}`;

        const zeroth = {};
        const exif = {};
        zeroth[piexif.ImageIFD.Make] = "WangBang Construction";
        zeroth[piexif.ImageIFD.Model] = "WB Field Camera";
        zeroth[piexif.ImageIFD.Software] = "WB AI Safety System";
        zeroth[piexif.ImageIFD.DateTime] = exifTimeStr;
        exif[piexif.ExifIFD.DateTimeOriginal] = exifTimeStr;
        exif[piexif.ExifIFD.DateTimeDigitized] = exifTimeStr;

        const exifObj = { "0th": zeroth, "Exif": exif };
        const exifBytes = piexif.dump(exifObj);
        return piexif.insert(exifBytes, jpegDataUrl);
      } catch (e) {
        console.warn("EXIF 寫入略過:", e);
        return jpegDataUrl;
      }
    }

    function drawTimestampOnCanvas(ctx, w, h, epochMs) {
      const dateStr = formatTaiwanWatermarkDate(epochMs || Date.now());

      const targetBoxH = Math.max(24, Math.floor(h * 0.05));
      const fontSize = Math.max(14, Math.floor(targetBoxH * 0.72));
      ctx.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
      ctx.textBaseline = "middle";

      const textW = ctx.measureText(dateStr).width;
      const padX = Math.max(8, Math.floor(fontSize * 0.35));
      const boxW = textW + padX * 2;
      const boxH = targetBoxH;

      const marginR = Math.max(10, Math.floor(w * 0.022));
      const marginB = Math.max(10, Math.floor(h * 0.030));
      const boxX1 = w - marginR - boxW;
      const boxY1 = h - marginB - boxH;

      ctx.fillStyle = "#000000";
      ctx.fillRect(boxX1, boxY1, boxW, boxH);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(dateStr, boxX1 + padX, boxY1 + boxH / 2);
    }

    function captureAndOrientPhoto(sourceEl, srcW, srcH, isFromGallery, shotEpochMs) {
      const orientCanvas = document.getElementById("orientCanvas");
      const oCtx = orientCanvas.getContext("2d");

      let rotDeg = 0;

      if (!isFromGallery) {
        const pose = getEffectivePose();
        const isStreamPortrait = (srcH > srcW);

        if (pose === "LANDSCAPE_LEFT") {
          rotDeg = isStreamPortrait ? -90 : 0;
        } else if (pose === "LANDSCAPE_RIGHT") {
          rotDeg = isStreamPortrait ? 90 : 0;
        } else {
          rotDeg = 0;
        }
      }

      if (rotDeg === -90) {
        orientCanvas.width = srcH;
        orientCanvas.height = srcW;
        oCtx.save();
        oCtx.translate(0, srcW);
        oCtx.rotate(-Math.PI / 2);
        oCtx.drawImage(sourceEl, 0, 0, srcW, srcH);
        oCtx.restore();
      } else if (rotDeg === 90) {
        orientCanvas.width = srcH;
        orientCanvas.height = srcW;
        oCtx.save();
        oCtx.translate(srcH, 0);
        oCtx.rotate(Math.PI / 2);
        oCtx.drawImage(sourceEl, 0, 0, srcW, srcH);
        oCtx.restore();
      } else {
        orientCanvas.width = srcW;
        orientCanvas.height = srcH;
        oCtx.drawImage(sourceEl, 0, 0, srcW, srcH);
      }

      const upW = orientCanvas.width;
      const upH = orientCanvas.height;
      const isPortraitPhoto = (upH > upW);

      const outW = isPortraitPhoto ? 1080 : 1440;
      const outH = isPortraitPhoto ? 1440 : 1080;
      const targetRatio = outW / outH;

      const canvas = document.getElementById("watermarkCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = outW;
      canvas.height = outH;

      let cropW, cropH, cropX, cropY;
      if (upW / upH > targetRatio) {
        cropH = upH;
        cropW = Math.round(upH * targetRatio);
        cropX = Math.round((upW - cropW) / 2);
        cropY = 0;
      } else {
        cropW = upW;
        cropH = Math.round(upW / targetRatio);
        cropX = 0;
        cropY = Math.round((upH - cropH) / 2);
      }

      ctx.drawImage(orientCanvas, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
      drawTimestampOnCanvas(ctx, outW, outH, shotEpochMs);
      return canvas.toDataURL("image/jpeg", 0.92);
    }

    function takeInstantShot() {
      const video = document.getElementById("cameraVideo");
      if (!video || !video.videoWidth) {
        alert("鏡頭尚未就緒，請稍候 1 秒再按！");
        return;
      }

      const flash = document.getElementById("flashOverlay");
      flash.style.opacity = "0.85";
      setTimeout(() => { flash.style.opacity = "0"; }, 100);

      const shotEpochMs = allocateUniqueEpochMs(Date.now());
      const rawJpegBase64 = captureAndOrientPhoto(video, video.videoWidth, video.videoHeight, false, shotEpochMs);
      queueUpload(rawJpegBase64, shotEpochMs);
    }

    function updateStatusDisplay(msg) {
      const statusBox = document.getElementById("statusBox");
      const homeStatusBox = document.getElementById("homeStatusBox");
      if (statusBox) statusBox.innerText = msg;
      if (homeStatusBox) {
        homeStatusBox.style.display = "block";
        homeStatusBox.innerText = msg;
      }
    }

    function queueUpload(rawJpegBase64, shotEpochMs) {
      const vendor = getSelectedVendor();
      const pType = currentPhotoType;

      currentGroupShots++;
      const shotNum = currentGroupShots;

      const finalEpochMs = (typeof shotEpochMs === "number" && shotEpochMs > 0)
        ? shotEpochMs
        : allocateUniqueEpochMs(Date.now());
      const timeStr = formatTaiwanTimeStr(finalEpochMs);

      const watermarkedWithExifBase64 = injectExifDateTime(rawJpegBase64, finalEpochMs);

      updateShootingUI();

      const thumbStrip = document.getElementById("thumbStrip");
      const hintEl = thumbStrip.querySelector(".thumb-empty-hint");
      if (hintEl) hintEl.remove();

      const thumb = document.createElement("img");
      thumb.className = "thumb-item";
      thumb.src = watermarkedWithExifBase64;
      thumbStrip.appendChild(thumb);
      thumbStrip.scrollLeft = thumbStrip.scrollWidth;
      thumbStrip.scrollTop = thumbStrip.scrollHeight;

      activeUploads++;
      updateStatusDisplay(`⏳ 上傳中 (尚有 ${activeUploads} 張)...`);

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          base64Data: watermarkedWithExifBase64,
          vendorName: vendor,
          isNight: isNightMode,
          customTimeStr: timeStr,
          photoType: pType
        })
      })
      .then(r => r.json())
      .then(res => {
        activeUploads = Math.max(0, activeUploads - 1);
        if (res && res.success) {
          if (Array.isArray(res.vendors) && res.vendors.length > 0) {
            renderVendorOptions(res.vendors, pType === "WORKER" ? vendor : null);
          }
          if (activeUploads === 0) {
            updateStatusDisplay(`✅ 第 ${shotNum} 張已存入雲端！`);
          } else {
            updateStatusDisplay(`⏳ 上傳中 (尚有 ${activeUploads} 張)...`);
          }
        } else {
          updateStatusDisplay(`❌ 失敗：${res ? res.error : ''}`);
        }
      })
      .catch(() => {
        activeUploads = Math.max(0, activeUploads - 1);
        updateStatusDisplay(`❌ 網路異常，請重試`);
      });
    }

    function handleGalleryFiles(files) {
      if (!files || files.length === 0) return;
      const fileList = Array.from(files);
      document.getElementById("galleryInput").value = "";

      fileList.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          const origEpochMs = extractOriginalEpochFromDataUrl(dataUrl, file.lastModified);
          const shotEpochMs = allocateUniqueEpochMs(origEpochMs);

          const img = new Image();
          img.onload = function() {
            const rawJpegBase64 = captureAndOrientPhoto(img, img.width, img.height, true, shotEpochMs);
            queueUpload(rawJpegBase64, shotEpochMs);
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
